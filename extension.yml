schema_version: "1.0"

extension:
  id: pstack
  name: "Pstack Workflow"
  version: "0.2.0"
  description: "Full pstack discipline for spec-kit: Poteto mode, 17-role model dispatch, 47 translated skills with their 23 playbooks and 23 principle leaves, the task contract, and evidence-gated verification"
  author: Jrecos
  repository: https://github.com/Jrecos/speckit-pstack
  license: MIT

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
  - name: speckit.pstack.roles
    file: commands/speckit.pstack.roles.md
    description: "Resolve pstack dispatch lanes from the project role map, and report what this host can dispatch"
  - name: speckit.pstack.tasks
    file: commands/speckit.pstack.tasks.md
    description: "Apply the pstack task contract to tasks.md: verifiable units, data-shape-first, declared writes on every task, honest [P] markers, invalidated proof for changed tasks"
  - name: speckit.pstack.implement
    file: commands/speckit.pstack.implement.md
    description: "Implement tasks.md with pstack rigor: shape first, ownership-safe workspace handling, disjoint-write [P] batches, structured worker reports, evidence-gated completion"
  - name: speckit.pstack.verify
    file: commands/speckit.pstack.verify.md
    description: "Re-prove every completed task from live artifacts, resolve roles and capabilities first, uncheck phantom completions"
  - name: speckit.pstack.mode-refresh
    file: commands/speckit.pstack.mode-refresh.md
    description: "Reload the active pstack mode before a core phase. No-op when the mode is off"
  - name: speckit.pstack.architect
    file: commands/generated/speckit.pstack.architect.md
    description: "Sketch types, signatures, and module structure before code, then stay in the loop while implementation fills in. Use for speckit.pstack.architect, 'architect this', 'design this', or non-trivial work where jumping to code would lock in the wrong shape"
  - name: speckit.pstack.arena
    file: commands/generated/speckit.pstack.arena.md
    description: "Spawn N parallel candidates at the same task, pick a base, graft the strongest parts of the losers into it. Use for speckit.pstack.arena, 'arena this', 'throw it in the arena', or when one attempt at a non-trivial artifact would lock in the wrong shape"
  - name: speckit.pstack.automate-me
    file: commands/generated/speckit.pstack.automate-me.md
    description: "Use for 'automate me', 'create/update/refresh my -mode skill', 'turn/capture my preferences or working style into a skill', or wanting agents to follow how the user works. Drafts or revises a personal -mode skill via create-skill + unslop, optionally pulling fresh evidence from recent transcripts"
  - name: speckit.pstack.blast-radius
    file: commands/generated/speckit.pstack.blast-radius.md
    description: "Find what a change could break somewhere else before it ships, beyond the diff, and prove the one fact it's safe because of by running real code instead of writing it up. Use for 'blast radius of X', 'what could this break', or reviewing a small diff you don't trust"
  - name: speckit.pstack.bro
    file: commands/generated/speckit.pstack.bro.md
    description: "Restate the last message in plain human language, with no jargon"
  - name: speckit.pstack.create-verification-skill
    file: commands/generated/speckit.pstack.create-verification-skill.md
    description: "Generate a project-local verification skill that drives your app the way a user does \u2014 any language, framework, or platform. Use for speckit.pstack.create-verification-skill, 'make a control skill for this repo', or when a project has no scripted way to prove UI/CLI/service behavior"
  - name: speckit.pstack.figure-it-out
    file: commands/generated/speckit.pstack.figure-it-out.md
    description: "Design an auditable playbook when no narrower one fits: a large migration, an ambitious multi-part change, or work a human reviews after stepping away. Scales rigor to the task, runs a hypothesis loop, and logs decisions via show-me-your-work. Use for speckit.pstack.figure-it-out, 'figure it out', a large migration, or when no narrower playbook applies"
  - name: speckit.pstack.how
    file: commands/generated/speckit.pstack.how.md
    description: "Use for 'how does X work', code walkthroughs before changing something, and placement / ownership / layering questions ('where should this live', 'which package owns this', 'is this the right layer'). Explains subsystem architecture, runtime flow, onboarding mental models. Use why for motivation"
  - name: speckit.pstack.interrogate
    file: commands/generated/speckit.pstack.interrogate.md
    description: "Use for 'interrogate', 'adversarial review', 'multi-model review', 'challenge this', 'stress test this code', 'find blind spots', or 'tear this apart'. Multiple LLM reviewers challenge changes from independent angles"
  - name: speckit.pstack.maintain-verification-skill
    file: commands/generated/speckit.pstack.maintain-verification-skill.md
    description: "Periodic pass that keeps a project's verification skill and feature map honest: parallel source readers per feature, one live session driving every feature, at most one PR of proven corrections. Use for speckit.pstack.maintain-verification-skill or 'audit the verify skill'"
  - name: speckit.pstack.make-bot-ui
    file: commands/generated/speckit.pstack.make-bot-ui.md
    description: "Use when building a custom UI (page, dashboard, buttons) that should wake an external bot over a webhook, when the user must supply a webhook sender key, or when exposing that UI on Tailscale"
  - name: speckit.pstack.no-comments
    file: commands/generated/speckit.pstack.no-comments.md
    description: "Spawn Comment Sicko, fix accepted findings, and offer encodings for claimed constraints"
  - name: speckit.pstack.poteto-mode
    file: commands/generated/speckit.pstack.poteto-mode.md
    description: "poteto's agent style for concise, detailed responses, deliberate subagents, unslopped prose, simple code, and verified work. Use for poteto, speckit.pstack.poteto-mode, or requests to work in this style"
  - name: speckit.pstack.principle-attack-the-premise
    file: commands/generated/speckit.pstack.principle-attack-the-premise.md
    description: "Apply when two or more fixes that share one premise have failed the same gate. Take a census of which actors hold the imbalance before the next fix, then question the premise instead of writing another fix that assumes it"
  - name: speckit.pstack.principle-boundary-discipline
    file: commands/generated/speckit.pstack.principle-boundary-discipline.md
    description: "Apply when wiring validation, error handling, or framework adapters. Concentrate guards at system boundaries (CLI, config, network, external APIs); trust internal types and keep business logic in pure functions"
  - name: speckit.pstack.principle-build-the-lever
    file: commands/generated/speckit.pstack.principle-build-the-lever.md
    description: "Apply to any non-trivial work, not just bulk work: edits, migrations, analyses, checks. Build the tool that does it or proves it (codemod, script, generator, or a skill your subagents follow) instead of working by hand. The tool is the artifact a reviewer can rerun"
  - name: speckit.pstack.principle-encode-lessons-in-structure
    file: commands/generated/speckit.pstack.principle-encode-lessons-in-structure.md
    description: "Apply when you catch yourself writing the same instruction a second time, or notice a recurring correction. Encode the rule as a lint, metadata flag, runtime check, or script instead of more text"
  - name: speckit.pstack.principle-exhaust-the-design-space
    file: commands/generated/speckit.pstack.principle-exhaust-the-design-space.md
    description: "Apply when facing a novel UI interaction or architectural decision with no precedent in the codebase. Build 2-3 competing prototypes and compare side by side before committing"
  - name: speckit.pstack.principle-experience-first
    file: commands/generated/speckit.pstack.principle-experience-first.md
    description: "Apply when product, UX, or feature-scope tradeoffs come up. Choose user delight over implementation convenience; ship fewer polished features over more rough ones"
  - name: speckit.pstack.principle-fix-root-causes
    file: commands/generated/speckit.pstack.principle-fix-root-causes.md
    description: "Apply when debugging. Trace each symptom to its root cause and fix it there; reproduce first, ask why until you reach it, resist nil-check guards that silence crashes"
  - name: speckit.pstack.principle-foundational-thinking
    file: commands/generated/speckit.pstack.principle-foundational-thinking.md
    description: "Apply before writing logic: choosing core types and data structures, sequencing scaffold-vs-feature work, asking what concurrent actors share. Get the data structures right so downstream code becomes obvious"
  - name: speckit.pstack.principle-guard-the-context-window
    file: commands/generated/speckit.pstack.principle-guard-the-context-window.md
    description: "Apply when context is filling up: large outputs, long files, repeated reads, fan-out planning. Route bulk to subagents; keep summaries in the main thread, not raw payloads"
  - name: speckit.pstack.principle-laziness-protocol
    file: commands/generated/speckit.pstack.principle-laziness-protocol.md
    description: "Apply when refactoring, evaluating diff size, or tempted to add abstractions, layers, or signal threading. Bias toward deletion and the smallest change that solves the problem"
  - name: speckit.pstack.principle-make-operations-idempotent
    file: commands/generated/speckit.pstack.principle-make-operations-idempotent.md
    description: "Apply when designing commands, lifecycle steps, or processing loops that run amid crashes, restarts, and retries. Converge to the same end state regardless of partial prior runs"
  - name: speckit.pstack.principle-migrate-callers-then-delete-legacy-apis
    file: commands/generated/speckit.pstack.principle-migrate-callers-then-delete-legacy-apis.md
    description: "Apply when introducing a new internal API while old callers still exist. Migrate callers and delete the old API in the same wave instead of preserving compatibility layers"
  - name: speckit.pstack.principle-minimize-reader-load
    file: commands/generated/speckit.pstack.principle-minimize-reader-load.md
    description: "Apply when reviewing or shaping code that's hard to trace. Count layers between question and answer, and hidden state in the reader's head; collapse one-caller wrappers and shrink mutable scope"
  - name: speckit.pstack.principle-model-the-domain
    file: commands/generated/speckit.pstack.principle-model-the-domain.md
    description: "Apply when writing stateful logic, or when code branches a lot or repeats a shape assumption across files. Encode the domain in a structure instead of scattered conditionals"
  - name: speckit.pstack.principle-never-block-on-the-human
    file: commands/generated/speckit.pstack.principle-never-block-on-the-human.md
    description: "Apply when tempted to ask 'should I do X?' on reversible work. Proceed, present the result, let the human course-correct after the fact; reserve confirmation for irreversible actions"
  - name: speckit.pstack.principle-outcome-oriented-execution
    file: commands/generated/speckit.pstack.principle-outcome-oriented-execution.md
    description: "Apply during planned rewrites and migrations with explicit phase boundaries. Converge on the target architecture; don't preserve smooth intermediate states with throwaway compatibility code"
  - name: speckit.pstack.principle-prove-it-works
    file: commands/generated/speckit.pstack.principle-prove-it-works.md
    description: "Apply after completing a task, before declaring done. Verify against the real artifact (run the feature, read the actual value, inspect the diff), not a proxy, self-report, or 'it compiles"
  - name: speckit.pstack.principle-redesign-from-first-principles
    file: commands/generated/speckit.pstack.principle-redesign-from-first-principles.md
    description: "Apply when integrating a new requirement into an existing design. Redesign as if the requirement had been a foundational assumption from day one, instead of bolting it on"
  - name: speckit.pstack.principle-separate-before-serializing-shared-state
    file: commands/generated/speckit.pstack.principle-separate-before-serializing-shared-state.md
    description: "Apply when concurrent actors might write to the same file, branch, key, or state object. Eliminate the sharing first; serialize structurally only when one shared writer is a real invariant"
  - name: speckit.pstack.principle-sequence-verifiable-units
    file: commands/generated/speckit.pstack.principle-sequence-verifiable-units.md
    description: "Apply to multi-step work (sweeps, migrations, runs of similar edits) and to how you stack commits and PRs. Break work into small units that each end in a verifiable state, check each before the next, and order delivery so the sequence proves itself to a reviewer"
  - name: speckit.pstack.principle-subtract-before-you-add
    file: commands/generated/speckit.pstack.principle-subtract-before-you-add.md
    description: "Apply when sequencing an addition, refactor, or rewrite. Remove dead code, redundant validators, and stub references first, then build on the simpler base"
  - name: speckit.pstack.principle-test-behavior-not-implementation
    file: commands/generated/speckit.pstack.principle-test-behavior-not-implementation.md
    description: "Apply when you write, change, or keep a test. Call the code the way its users do and assert the result they observe against a literal expected value. If the test would still pass when every imported function returns undefined, rewrite the assertion or delete the test"
  - name: speckit.pstack.principle-type-system-discipline
    file: commands/generated/speckit.pstack.principle-type-system-discipline.md
    description: "Apply when designing types, reviewing a function signature, or writing code in any statically-typed language. Make illegal states unrepresentable, brand semantic primitives, parse external data at boundaries, refuse to lie to the compiler, exhaust variants, derive from authoritative schemas"
  - name: speckit.pstack.recall
    file: commands/generated/speckit.pstack.recall.md
    description: "Reconstruct your recent working context from your own chat history, live state, and the shared record (user reports, prior fixes, incidents), then hand back a tight current-state brief. Use for 'recall my work on X', 'catch me up', 'what have I been working on', 'where did I leave off', before starting or resuming work"
  - name: speckit.pstack.reflect
    file: commands/generated/speckit.pstack.reflect.md
    description: "Spawn three parallel review subagents over the active transcript, surface learnings, and route each to a concrete edit on an existing skill. Use when the user says reflect"
  - name: speckit.pstack.setup-pstack
    file: commands/generated/speckit.pstack.setup-pstack.md
    description: "Configure which models pstack uses per role. Detects the model selectors your host actually accepts and writes the project role map that every pstack dispatch reads. Use for speckit.pstack.setup-pstack, 'configure pstack models', or changing pstack's model choices"
  - name: speckit.pstack.show-me-your-work
    file: commands/generated/speckit.pstack.show-me-your-work.md
    description: "Keep a reviewable decision trail for long-running or unattended work: a TSV log with one row per decision (what, why, evidence, result). Local by default; commit it when a reviewer needs the trail to trust the result. Use for speckit.pstack.show-me-your-work, autonomous or multi-phase runs, or work a human reviews after stepping away"
  - name: speckit.pstack.swarm
    file: commands/generated/speckit.pstack.swarm.md
    description: "Fan out N parallel workers, drain them, and return one report. Use for speckit.pstack.swarm, 'swarm this', or parallel coverage, races, gauntlets, and exploration"
  - name: speckit.pstack.tdd
    file: commands/generated/speckit.pstack.tdd.md
    description: "Use only when the user explicitly asks for TDD, a failing test, or a regression test, OR when the bug has an obvious cheap local test target. Skip when the test path is unclear, expensive, integration-heavy, or not requested"
  - name: speckit.pstack.teach
    file: commands/generated/speckit.pstack.teach.md
    description: "Explain a body of work plainly so a person actually understands it. Runs the `how` and `why` skills and weaves what they find into one clear explanation. Use for 'teach me this', 'help me really understand X', 'explain this change or subsystem to me'"
  - name: speckit.pstack.technical-writing
    file: commands/generated/speckit.pstack.technical-writing.md
    description: "Layered technical-writing standard: Di\u00e1taxis structure, Google developer style sentences, STE instruction rules, Global English syntax. Use for speckit.pstack.technical-writing or when writing or reviewing docs, RFCs, readmes, PR descriptions, or commit messages"
  - name: speckit.pstack.typescript-best-practices
    file: commands/generated/speckit.pstack.typescript-best-practices.md
    description: "TypeScript best practices. Use when reading or editing any .ts or .tsx file"
  - name: speckit.pstack.unslop
    file: commands/generated/speckit.pstack.unslop.md
    description: "Cut AI tells from any writing. Must always apply"
  - name: speckit.pstack.why
    file: commands/generated/speckit.pstack.why.md
    description: "Use for 'why does X work this way', 'why we picked Y', design rationale, regressions, postmortems, or data-backed thresholds. Discovers available MCPs and queries each evidence category (source control, issue tracker, long-form docs, real-time chat, infrastructure observability, error tracking, product analytics warehouse) in parallel, then returns a cited read on decisions and tradeoffs. Use how for runtime behavior"

  config:
    - name: pstack-config.yml
      template: pstack-config.template.yml
      description: "Legacy lane selectors (roles.verify, roles.swarm) and parallel.max_workers, read once by speckit.pstack.setup-pstack as migration input; nothing reads this file at runtime"
      required: false
    - name: pstack-models-config.yml
      template: pstack-models-config.template.yml
      description: "Project role map: one entry per pstack role, strict JSON so the runtime helper needs no YAML parser"
      required: false

hooks:
  before_specify:
    command: speckit.pstack.mode-refresh
    optional: false
    description: "Checks project-mode readiness, loads the contract only when ready, and otherwise does nothing"
  before_plan:
    command: speckit.pstack.mode-refresh
    optional: false
    description: "Checks project-mode readiness, loads the contract only when ready, and otherwise does nothing"
  before_tasks:
    command: speckit.pstack.mode-refresh
    optional: false
    description: "Checks project-mode readiness, loads the contract only when ready, and otherwise does nothing"
  before_implement:
    command: speckit.pstack.mode-refresh
    optional: false
    description: "Checks project-mode readiness, loads the contract only when ready, and otherwise does nothing"

tags:
  - "workflow"
  - "quality"
  - "verification"
  - "parallelism"
  - "mode"
