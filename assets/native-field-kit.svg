  <rect x="76" y="86.8" width="36" height="2.4" fill="#C08A45"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
    <text x="76" y="116" font-size="11" letter-spacing="3.4" fill="#2A2622" fill-opacity="0.58">PLATE I</text>
