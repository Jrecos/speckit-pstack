  <rect x="709" y="107" width="300" height="180" rx="9" fill="#3A3227" fill-opacity="0.08"/>
  <rect x="704" y="104" width="300" height="180" rx="9" fill="#FDFAF3" stroke="#2A2622" stroke-opacity="0.6" stroke-width="1.2"/>
