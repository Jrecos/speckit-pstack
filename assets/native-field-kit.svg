  <text x="1098" y="187" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.3" fill="#2A2622" fill-opacity="0.92">PLAYBOOKS</text>

